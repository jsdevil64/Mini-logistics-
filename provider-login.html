<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Provider Login</title><link rel="stylesheet" href="styles.css"></head>
<body><header><a class="brand" href="index.html">🛻 Mini Logistics</a><nav><a href="provider-register.html">Register</a></nav></header><main class="auth"><div class="panel"><span class="pill">Provider</span><h1>Login</h1><form id="loginForm"><input id="phone" placeholder="Phone number" required><div class="password-wrap"><input id="password" type="password" placeholder="Password" required><button type="button" class="show-password" data-target="password" aria-label="Show password">👁️</button></div><button>Login</button></form><p id="msg"></p></div></main><script type="module" src="provider.js"></script><script>document.querySelectorAll(".show-password").forEach(b=>b.addEventListener("click",()=>{const i=document.getElementById(b.dataset.target);const show=i.type==="password";i.type=show?"text":"password";b.textContent=show?"🙈":"👁️";b.setAttribute("aria-label",show?"Hide password":"Show password");}));</script></body></html>
